<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock, Paper, Scissors</title>
</head>
<body>
    


    <script>
        let userScore = 0;
        let computerScore = 0;
        
        function getComputerChoice() {
            let computerChoice = Math.random();
            if (computerChoice < .3) {
                return "Rock" 
            }
            if ( 0.3 < computerChoice && computerChoice < 0.6 ) {
                return "Paper"
            }
            return "Scissors"
        } 

        function getUserChoice() {
            let userChoice = Number(window.prompt("Choose [1]Rock, [2]Paper, or [3]Scissors: numbers only"))
            if (userChoice == 1) {
                return "Rock"
            }
            if (userChoice == 2) {
                return "Paper"
            }
            if (userChoice == 3) {
                return "Scissors"
            }
            return "Invalid Selection"
        }

        console.log(getUserChoice())
    </script>
</body>
</html>
